name: AstroWiki CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/astrowiki_lint.py --quiet
      - run: python tools/ads_sync.py search "supernova remnants" --limit 1 --dry-run
      - run: python tools/run_benchmark.py --fixture benchmarks/fixtures/s2fitting-noria
      - run: python tools/run_benchmark.py --fixture benchmarks/fixtures/final-project-scaling
