name: AstroWiki CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/lint.py --quiet
      - run: python tools/sync.py search "supernova remnants" --limit 1 --dry-run
      - run: python tools/server.py --smoke
